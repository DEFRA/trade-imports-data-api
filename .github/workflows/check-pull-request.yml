name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      id-token: write      
      packages: write
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 #v6.0.0
        with:
          dotnet-version: |
            10.0
      - name: Update NuGet.config
        run: |
          dotnet nuget remove source defra
          dotnet nuget add source --username USERNAME --password ${{ env.GITHUB_TOKEN }} --store-password-in-clear-text --name defra "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --configfile NuGet.config
      - name: Run unit tests
        run: |
          dotnet test --filter "Category!=IntegrationTest"
      - name: Run integration tests
        run: |
          docker compose up -d
          dotnet test --filter "Category=IntegrationTest"
      - name: Docker Compose Logs
        if: always()
        run: |
          docker compose logs
      - name: Check Dockerfile Builds
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: trade-imports-data-api:latest
      - name: Check with Trivy
        run: |
          docker run -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image \
            --ignore-unfixed \
            --exit-code 1 \
            trade-imports-data-api:latest
      - name: Pack NuGets
        if: github.actor != 'dependabot[bot]'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          echo "Building a pre-release package for PR #$PR_NUMBER"
          dotnet pack --no-restore --configuration Release -o ./nupkg \
            /p:VersionSuffix="pr-$PR_NUMBER.$BUILD_NUMBER"
      - name: Publish NuGets
        if: github.actor != 'dependabot[bot]'
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key ${{ env.GITHUB_TOKEN }} \
            --skip-duplicate
      - name: Generate OpenAPI specification
        run: make generate-openapi-spec
      - name: Save OpenApi specification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openapi.json
          path: openapi.json
  version-check:
    name: Check Package Versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: Check packable versions were bumped
        env:
          BASE_REF: ${{ github.base_ref }}
        run: ./.github/scripts/check-package-versions.sh
  sonarcloud-scan:
    name: CDP SonarCloud Scan
    permissions:
      pull-requests: write
      id-token: write      
      packages: read
      contents: read
    uses: ./.github/workflows/sonarcloud.yml
    needs: pr-validator
    secrets: inherit
